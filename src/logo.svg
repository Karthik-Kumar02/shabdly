<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Shabdly mark: voice bars hanging from a shirorekha, the headline that Devanagari letters hang from. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a5c"/>
      <stop offset="1" stop-color="#0e0a18"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.28" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#8b6cf0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.86" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#e8a58a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8a58a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.78" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#3fb7b0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3fb7b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="320" x2="0" y2="740">
      <stop offset="0" stop-color="#fcf0cf"/>
      <stop offset="0.45" stop-color="#e6c582"/>
      <stop offset="1" stop-color="#b3843f"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b0614" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#base)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#violet)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#rose)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#teal)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="3"/>
  <g id="mark">
    <rect x="252" y="320" width="520" height="56" rx="28"/>
    <rect x="274" y="320" width="60" height="200" rx="30"/>
    <rect x="378" y="320" width="60" height="320" rx="30"/>
    <rect x="482" y="320" width="60" height="420" rx="30"/>
    <rect x="586" y="320" width="60" height="290" rx="30"/>
    <rect x="690" y="320" width="60" height="170" rx="30"/>
  </g>
  <use href="#mark" fill="#e6c582" opacity="0.4" filter="url(#glow)"/>
  <use href="#mark" fill="url(#gold)"/>
</svg>
