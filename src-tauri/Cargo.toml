[package]
name = "shabdly"
version = "0.1.0"
description = "Words that learn you. Private voice dictation."
authors = ["Sai Karthik Sanjeev Kumar"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shabdly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shabdly-core = { path = "../crates/core" }
arboard = "3.7.0"
enigo = "0.6.1"
anyhow = "1.0.104"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
rdev = "0.5.3"
