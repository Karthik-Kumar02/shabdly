[package]
name = "shabdly"
version = "0.2.2"
description = "Words that learn you. Private voice dictation."
authors = ["Sai Karthik Sanjeev Kumar"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shabdly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shabdly-core = { path = "../crates/core" }
arboard = "3.7.0"
enigo = "0.6.1"
anyhow = "1.0.104"
cpal = "0.18.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
async-trait = "0.1.92"
fs4 = "0.13"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "std", "libc", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSString", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
rdev = "0.5.3"
uiautomation = "0.25.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
