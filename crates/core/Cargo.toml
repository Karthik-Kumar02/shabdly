[package]
name = "shabdly-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Platform-neutral core of Shabdly: dictionary, learning, cleanup pipeline, speech recognition."

[lib]
name = "shabdly_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
