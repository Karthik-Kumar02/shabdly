[package]
name = "shabdly-core"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Platform-neutral core of Shabdly: dictionary, learning, cleanup pipeline, speech recognition."

[lib]
name = "shabdly_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
similar = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
hound = "3.5.1"
tempfile = "3"
